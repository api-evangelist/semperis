name: Semperis
description: >-
  Semperis provides identity-first cybersecurity and disaster recovery for
  hybrid Active Directory, Entra ID, and Okta environments. Its platform
  prevents, detects, and responds to identity-based attacks and enables rapid
  recovery to a trusted state. Products include Directory Services Protector
  (AD/Entra ID threat prevention, detection, and response), Active Directory
  Forest Recovery, Disaster Recovery for Entra Tenant, Recovery for Okta,
  Lightning Intelligence security posture assessment, Delegation Manager,
  Migrator for AD, and the Ready1 crisis-response platform, alongside the free
  community tools Purple Knight and Forest Druid. Backed by Insight Partners,
  Semperis serves enterprises defending the identity attack surface. This
  profile was enriched from public sources; Semperis publishes no public
  developer/REST API surface as of this pass.
